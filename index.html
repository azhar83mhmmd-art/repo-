<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepoFast — GitHub Repository Manager</title>
  <meta name="description" content="Upload once. Organize everything. Push to GitHub. Upload a whole ZIP project to GitHub in a single commit.">
  <meta name="theme-color" content="#090B10">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/src/css/variables.css">
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/dashboard.css">
  <link rel="stylesheet" href="/src/css/responsive.css">
  <link rel="stylesheet" href="/src/css/polish.css">
  <link rel="stylesheet" href="/src/css/tutorial.css">
  <script>try{var t=JSON.parse(localStorage.getItem('repofast.prefs.v1')||'{}').theme||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark"><img src="/brand/logo-192.png" alt="RepoFast" width="38" height="38"></div>
        <div class="brand-text"><div class="brand-name">RepoFast</div><div class="brand-ver">v1.0.0</div></div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-group"><div class="nav-label">Workspace</div>
          <button class="nav-item" data-route="overview"><span data-icon="layout-dashboard"></span><span>Overview</span></button>
          <button class="nav-item" data-route="repositories"><span data-icon="folder-git-2"></span><span>Repositories</span></button>
          <button class="nav-item" data-route="upload"><span data-icon="cloud-upload"></span><span>Upload ZIP</span></button>
          <button class="nav-item" data-route="explorer"><span data-icon="files"></span><span>File Explorer</span></button>
        </div>
        <div class="nav-group"><div class="nav-label">Activity</div>
          <button class="nav-item" data-route="history"><span data-icon="history"></span><span>Upload History</span></button>
          <button class="nav-item" data-route="commits"><span data-icon="git-commit-horizontal"></span><span>Recent Commits</span></button>
        </div>
        <div class="nav-group"><div class="nav-label">Preferences</div>
          <button class="nav-item" data-route="connection"><span data-icon="github"></span><span>GitHub Connection</span></button>
          <button class="nav-item" data-route="settings"><span data-icon="settings-2"></span><span>Settings</span></button>
        </div>
      </nav>
      <div class="sidebar-foot">
        <div class="conn-card" id="connCard"></div>
        <div class="foot-actions">
          <button class="btn sm ghost block" id="disconnectBtn" hidden><span data-icon="log-out"></span><span>Disconnect</span></button>
          <button class="btn sm ghost icon-only" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar"><span data-icon="panel-left"></span></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon-only menu-btn" id="menuBtn" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="top-actions">
          <button class="search-trigger" id="searchBtn" aria-label="Search"><span data-icon="search"></span><span class="st-text">Search…</span><kbd>Ctrl K</kbd></button>
          <button class="btn ghost icon-only search-icon-only" id="searchBtn2" aria-label="Search"><span data-icon="search"></span></button>
          <button class="btn ghost icon-only" id="themeBtn" aria-label="Toggle theme"></button>
          <button class="avatar-btn" id="userBtn" aria-label="Account menu"></button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation">
    <button data-route="overview"><span data-icon="layout-dashboard"></span>Home</button>
    <button data-route="repositories"><span data-icon="folder-git-2"></span>Repos</button>
    <button data-route="upload" class="fab"><span data-icon="cloud-upload"></span>Upload</button>
    <button data-route="explorer"><span data-icon="files"></span>Files</button>
    <button data-route="settings"><span data-icon="settings-2"></span>Settings</button>
  </nav>
  <noscript><p style="padding:24px;color:#fff">RepoFast needs JavaScript to run.</p></noscript>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
